name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify porting setup and regression manifests
        run: ./gradlew verifyPortSetup --console=plain

      - name: Run 1.21.1 GameTests
        run: ./gradlew :1.21.1:runGameTestServer --console=plain

      - name: Audit 1.21.1 mixin units
        run: ./gradlew :1.21.1:auditMixins --console=plain

      - name: Build with Gradle
        run: ./gradlew build --console=plain
