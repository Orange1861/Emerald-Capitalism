// Shared build script for the calendar-versioning NeoForge targets:
// 26.1, 26.2 (Java 25, no Parchment, Mojang mappings ship with real names).
// The repository's src/ tree is shared. A version folder supplies only its
// gradle.properties and any explicitly allowlisted target override.

import com.orangevillager61.emeraldcapitalism.build.MixinAuditTask

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// Stonecutter shares this build script across two real Gradle subprojects
// (26.1, 26.2), each with its own gradle.properties. Gradle's automatic
// loading of subproject-level gradle.properties files is inconsistent
// (documented as "limited support" in Gradle's own issue tracker), so load
// this project's file explicitly instead of relying on it.
def versionProps = new Properties()
file("$projectDir/gradle.properties").withInputStream { versionProps.load(it) }
versionProps.each { key, value -> project.ext.set(key, value) }

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// 26.1+ requires Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

sourceSets {
    main {
        java.srcDir rootProject.file('src/main/java')
        resources.srcDir rootProject.file('src/main/resources')
    }
    test {
        java.srcDir rootProject.file('src/test/java')
    }
}

tasks.register('verifyTargetSetup') {
    group = 'verification'
    description = 'Verifies this calendar target uses an available Java 25 toolchain.'
    inputs.file(file('gradle.properties'))

    doLast {
        int configuredJava = Integer.parseInt(java_version)
        if (configuredJava != 25) {
            throw new GradleException("Calendar target ${minecraft_version} must declare java_version=25, found ${configuredJava}")
        }

        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(configuredJava)
        }.get()
        if (launcher.metadata.languageVersion.asInt() != configuredJava) {
            throw new GradleException("Java ${configuredJava} toolchain was not selected for ${minecraft_version}")
        }
        logger.lifecycle("Verified ${minecraft_version}: Java ${configuredJava} (${launcher.metadata.installationPath})")
    }
}

evaluationDependsOn(':core')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // No parchment block here: Mojang ships real names starting with 26.1,
    // obfuscation is gone, so Parchment mappings aren't needed on this branch.

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            // Re-verify this working-directory resolution behavior on 26.x. The
            // legacy branch's comment about StructureUtils.testStructuresDir was
            // specific to how 1.21.1 resolved it; confirm it still holds here.
            gameDirectory = project.file('.')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // Calendar-era NeoForge uses the split clientData/serverData run types.
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(rootProject.project(':core').sourceSets.main)
        }
    }
}

tasks.register('auditMixins', MixinAuditTask) {
    group = 'verification'
    description = 'Validates and subtractively audits every configured mixin in isolated GameTest JVMs.'
    dependsOn tasks.named('classes')
    dependsOn tasks.named('prepareGameTestServer')
    notCompatibleWithConfigurationCache('The task intentionally launches a sequential matrix of isolated JVMs.')

    repositoryDirectory.set(rootProject.layout.projectDirectory)
    buildOutputDirectory.set(layout.buildDirectory)
    manifestFile.set(rootProject.layout.projectDirectory.file('gradle/mixin-audit.json'))
    mixinConfigFile.set(rootProject.layout.projectDirectory.file('src/main/resources/emeraldcapitalism.mixins.json'))
    vmArgsFile.set(layout.buildDirectory.file('moddev/gameTestServerRunVmArgs.txt'))
    programArgsFile.set(layout.buildDirectory.file('moddev/gameTestServerRunProgramArgs.txt'))
    legacyClasspathFile.set(layout.buildDirectory.file('moddev/gameTestServerLegacyClasspath.txt'))
    mergedMinecraftJar.set(layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-merged.jar"))
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir file('src/generated/resources') }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':core')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.named('jar', Jar).configure {
    dependsOn(':core:classes')
    from(project(':core').sourceSets.main.output)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/templates')
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
