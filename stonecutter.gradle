import groovy.json.JsonSlurper
import com.orangevillager61.emeraldcapitalism.build.NavigationArchitectureScanner

plugins {
    id 'dev.kikugie.stonecutter'
    // Resolve ModDevGradle once so every Stonecutter subproject shares the
    // same plugin classes. Its IntelliJ integration registers IdeaExtPlugin
    // on the root project and otherwise can collide across plugin versions.
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

stonecutter.active '1.21.1' /* [SC] DO NOT EDIT */

// Root-only task. This can't live in build-legacy.gradle or build-calendar.gradle,
// 'wrapper' only exists on the true root project, not on generated version subprojects.
tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

def readPortingJson = { File path ->
    if (!path.isFile()) {
        throw new GradleException("Required porting manifest is missing: ${path}")
    }
    new JsonSlurper().parse(path) as Map
}

def relativePath = { File path ->
    file('.').toPath().relativize(path.toPath()).toString().replace('\\', '/')
}

def discoverGameTests = { File sourceRoot ->
    Set<String> tests = new TreeSet<>()
    if (!sourceRoot.isDirectory()) {
        return tests
    }
    sourceRoot.eachFileRecurse { File sourceFile ->
        if (!sourceFile.isFile() || !sourceFile.name.endsWith('.java')) {
            return
        }
        String source = sourceFile.getText('UTF-8')
        if (!source.contains('@GameTestHolder')) {
            return
        }
        String className = sourceFile.name.substring(0, sourceFile.name.length() - '.java'.length())
                .toLowerCase(Locale.ROOT)
        def matcher = source =~ /(?s)@GameTest\s*\([^)]*\)\s*public\s+static\s+void\s+([A-Za-z0-9_]+)\s*\(/
        matcher.each { match ->
            tests.add(className + '.' + match[1].toLowerCase(Locale.ROOT))
        }
    }
    tests
}

tasks.register('verifySharedSourceLayout') {
    group = 'verification'
    description = 'Enforces one shared source tree and allowlisted version-only overrides.'

    doLast {
        File sharedJava = file('src/main/java')
        File sharedResources = file('src/main/resources')
        if (!sharedJava.isDirectory() || !sharedResources.isDirectory()) {
            throw new GradleException('The shared src/main/java and src/main/resources trees are required')
        }

        Map manifest = readPortingJson(file('gradle/porting-overrides.json'))
        if (manifest.schemaVersion != 1 || manifest.sharedSource != 'src') {
            throw new GradleException('gradle/porting-overrides.json does not describe the shared src/ layout')
        }
        File versionsRoot = file('versions')
        Set<String> targets = versionsRoot.listFiles()
                .findAll { it.isDirectory() }
                .collect { it.name }
                .toSet()
        Set<String> manifestTargets = ((manifest.targets ?: [:]) as Map).keySet() as Set<String>
        if (targets != manifestTargets) {
            throw new GradleException("Version folders and porting-overrides targets differ: folders=${targets}, manifest=${manifestTargets}")
        }

        List errors = []
        targets.each { String targetName ->
            File targetRoot = new File(versionsRoot, targetName)
            if (!new File(targetRoot, 'gradle.properties').isFile()) {
                errors.add("${targetName} is missing gradle.properties")
            }
            Map targetManifest = (manifest.targets[targetName] ?: [:]) as Map
            Set<String> allowed = ((targetManifest.overrides ?: []) as List<String>)
                    .collect { it.replace('\\', '/') } as Set<String>
            File targetSource = new File(targetRoot, 'src')
            if (targetSource.isDirectory()) {
                targetSource.eachFileRecurse { File sourceFile ->
                    if (!sourceFile.isFile()) {
                        return
                    }
                    String relative = targetRoot.toPath().relativize(sourceFile.toPath()).toString()
                            .replace('\\', '/')
                    // Data generation writes target-local output here. It is a
                    // build product, not a second hand-maintained source tree.
                    if (relative.startsWith('src/generated/')) {
                        return
                    }
                    if (!allowed.contains(relative)) {
                        errors.add("${targetName}/${relative} is not an allowlisted API/resource override")
                    }
                }
            }
            allowed.each { String relative ->
                if (!new File(targetRoot, relative).isFile()) {
                    errors.add("${targetName}/${relative} is listed as an override but does not exist")
                }
            }
        }
        if (!errors.isEmpty()) {
            throw new GradleException('Shared source layout validation failed:\n' + errors.join('\n'))
        }

        int sharedJavaCount = fileTree(sharedJava).matching { include '**/*.java' }.files.size()
        int sharedResourceCount = fileTree(sharedResources).files.size()
        logger.lifecycle("Verified shared source layout: ${sharedJavaCount} Java files and ${sharedResourceCount} resources are single-source; no target copies are present.")
    }
}

tasks.register('verifyClientSmokeManifest') {
    group = 'verification'
    description = 'Checks that every custom renderer, renderer layer, and screen has a manual smoke entry.'

    doLast {
        Map manifest = readPortingJson(file('gradle/client-smoke.json'))
        if (manifest.schemaVersion != 1) {
            throw new GradleException('gradle/client-smoke.json must use schemaVersion 1')
        }
        List<Map> entries = ((manifest.renderers ?: []) + (manifest.screens ?: []) + (manifest.checks ?: [])) as List<Map>
        Set<String> ids = new HashSet<>()
        List<String> errors = []
        entries.each { Map entry ->
            String id = entry.id as String
            String path = (entry.path ?: entry.owner) as String
            if (!id || !ids.add(id)) {
                errors.add("duplicate or empty client smoke id: ${id}")
            }
            if (!path || !file(path).isFile()) {
                errors.add("client smoke entry ${id} points to missing file ${path}")
            }
            if (!((entry.checks as String)?.trim())) {
                errors.add("client smoke entry ${id} has no manual check description")
            }
        }

        Set<String> listedRendererPaths = (manifest.renderers ?: []).collect { it.path as String } as Set<String>
        Set<String> actualRendererPaths = fileTree('src/main/java/com/orangevillager61/emeraldcapitalism/client/renderer')
                .matching { include '**/*.java' }.files.collect { relativePath(it) } as Set<String>
        Set<String> listedScreenPaths = (manifest.screens ?: []).collect { it.path as String } as Set<String>
        Set<String> actualScreenPaths = fileTree('src/main/java/com/orangevillager61/emeraldcapitalism/client/screen')
                .matching { include '**/*.java' }.files.collect { relativePath(it) } as Set<String>
        Set<String> missing = new TreeSet<>()
        missing.addAll(actualRendererPaths - listedRendererPaths)
        missing.addAll(actualScreenPaths - listedScreenPaths)
        if (!missing.isEmpty()) {
            errors.addAll(missing.collect { "unlisted client renderer/screen: ${it}" })
        }

        if (!errors.isEmpty()) {
            throw new GradleException('Client smoke manifest validation failed:\n' + errors.join('\n'))
        }
        logger.lifecycle("Verified client smoke manifest: ${actualRendererPaths.size()} renderer files and ${actualScreenPaths.size()} screen files are covered.")
    }
}

tasks.register('verifyRegressionCoverage') {
    group = 'verification'
    description = 'Validates the focused unit, GameTest, and manual regression coverage manifest.'

    doLast {
        Map manifest = readPortingJson(file('gradle/regression-coverage.json'))
        if (manifest.schemaVersion != 1) {
            throw new GradleException('gradle/regression-coverage.json must use schemaVersion 1')
        }
        List<Map> entries = (manifest.entries ?: []) as List<Map>
        Set<String> ids = new HashSet<>()
        Set<String> required = [
                'persistence-bank', 'persistence-village', 'persistence-block-entities',
                'persistence-entities', 'networking-and-menus', 'villager-gameplay',
                'client-presentation'
        ] as Set<String>
        Set<String> discovered = discoverGameTests(file('src/main/java'))
        Set<String> smokeIds = [] as Set<String>
        Map smoke = readPortingJson(file('gradle/client-smoke.json'))
        ((smoke.renderers ?: []) + (smoke.screens ?: []) + (smoke.checks ?: [])).each {
            smokeIds.add('client-smoke.' + it.id.toString())
        }
        List<String> errors = []
        entries.each { Map entry ->
            String id = entry.id as String
            if (!id || !ids.add(id)) {
                errors.add("duplicate or empty regression coverage id: ${id}")
            }
            if (!((entry.boundary as String)?.trim())) {
                errors.add("${id} has no boundary description")
            }
            ((entry.unitTests ?: []) as List<String>).each { String path ->
                if (!file(path).isFile()) {
                    errors.add("${id} references missing unit test ${path}")
                }
            }
            ((entry.gameTests ?: []) as List).each { testValue ->
                String test = testValue.toString()
                if (!discovered.contains(test.toLowerCase(Locale.ROOT))) {
                    errors.add("${id} references unknown GameTest ${test}")
                }
            }
            ((entry.manualChecks ?: []) as List<String>).each { String check ->
                if (!smokeIds.contains(check)) {
                    errors.add("${id} references unknown manual check ${check}")
                }
            }
        }
        Set<String> missing = required - ids
        if (!missing.isEmpty()) {
            errors.addAll(missing.collect { "missing required regression boundary ${it}" })
        }
        if (!errors.isEmpty()) {
            throw new GradleException('Regression coverage validation failed:\n' + errors.join('\n'))
        }
        logger.lifecycle("Verified regression coverage manifest: ${entries.size()} risk boundaries and ${discovered.size()} GameTests discovered.")
    }
}

tasks.register('verifyNavigationScannerTests', Exec) {
    group = 'verification'
    description = 'Runs permanent in-memory adversarial tests for the Phase 2 architecture scanner.'
    String gradleCommand = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : './gradlew'
    workingDir project.projectDir
    commandLine gradleCommand, '-p', 'buildSrc', 'test', '--no-daemon', '--no-configuration-cache', '--console=plain'
}

tasks.register('verifyNavigationArchitecture') {
    group = 'verification'
    description = 'Validates the Phase 2 scheduler, ownership, scope, and navigation architecture inventory.'
    dependsOn 'verifyNavigationScannerTests'

    doLast {
        Map manifest = readPortingJson(file('gradle/navigation-architecture.json'))
        List<String> errors = []
        def asList = { Object value -> value instanceof Collection ? value as List : [] }
        def text = { Object value -> value == null ? '' : value.toString().trim() }
        def paths = { Map entry -> asList(entry.sourcePaths).collect { it.toString().replace('\\', '/') } }
        def requireText = { String label, Object value ->
            if (!text(value)) errors.add("${label} must be documented")
        }
        def requireList = { String label, Object value ->
            if (asList(value).isEmpty()) errors.add("${label} must not be empty")
        }
        def validPhases = asList(manifest.validMigrationPhases).collect { it as Integer } as Set<Integer>
        if (manifest.schemaVersion != 2 || manifest.phase != 2) {
            errors.add('gradle/navigation-architecture.json must use schemaVersion 2 and phase 2')
        }
        if (validPhases != (8..22) as Set<Integer>) {
            errors.add('validMigrationPhases must enumerate exactly Phase 8 through Phase 22')
        }
        List<Map> migrationPlan = asList(manifest.migrationPlan) as List<Map>
        Set<Integer> plannedPhases = [] as Set<Integer>
        migrationPlan.each { Map entry ->
            Integer plannedPhase = entry.phase as Integer
            if (!plannedPhases.add(plannedPhase)) errors.add("duplicate migration plan phase ${plannedPhase}")
            if (!validPhases.contains(plannedPhase)) errors.add("migrationPlan.${plannedPhase} must be a valid Phase 8-22 number")
            requireText("migrationPlan.${plannedPhase}.name", entry.name)
            requireText("migrationPlan.${plannedPhase}.scope", entry.scope)
            String planScope = text(entry.scope).toLowerCase()
            if (plannedPhase == 8 && planScope.contains('behavior migration') && !planScope.contains('no behavior migration')) {
                errors.add('migrationPlan Phase 8 must remain infrastructure-only')
            }
        }
        if (plannedPhases != validPhases) errors.add('migrationPlan must cover every valid phase exactly once')

        Map architecture = (manifest.architecture ?: [:]) as Map
        if (text(architecture.scheduler).toLowerCase() != 'brain') errors.add('The enforced villager scheduler must be Brain')
        ['current', 'target'].each { String side ->
            Map section = (architecture[side] ?: [:]) as Map
            ['scheduler', 'taskOwnership', 'movementIntent', 'routeExecutor', 'cleanup'].each { String key ->
                requireText("architecture.${side}.${key}", section[key])
            }
        }
        requireText('architecture.decision', architecture.decision)

        List<Map> externalVanillaExecutors = asList(manifest.externalVanillaExecutors) as List<Map>
        Set<String> externalExecutorIds = [] as Set<String>
        externalVanillaExecutors.each { Map entry ->
            String id = text(entry.id)
            if (!id || !externalExecutorIds.add(id)) errors.add("duplicate or empty external vanilla executor id: ${id}")
            ['minecraftVersion', 'executor', 'sourceAvailability', 'evidence'].each { String key -> requireText("${id}.${key}", entry[key]) }
        }
        if (!(externalExecutorIds.contains('villager-wanted-item-1.21.1') && externalExecutorIds.contains('villager-wanted-item-1.21.4'))) {
            errors.add('wanted-item-pursuit must document an external vanilla executor for Minecraft 1.21.1 and 1.21.4')
        }

        List<Map> frozenDecisions = asList(manifest.frozenDecisions) as List<Map>
        Set<String> frozenDecisionIds = [] as Set<String>
        frozenDecisions.each { Map entry ->
            String id = text(entry.id)
            if (!id || !frozenDecisionIds.add(id)) errors.add("duplicate or empty frozen decision id: ${id}")
            ['decision', 'ownershipScope', 'reason'].each { String key -> requireText("${id}.${key}", entry[key]) }
            if (!(entry.migrationPhase instanceof Number) || !validPhases.contains(entry.migrationPhase as Integer)) errors.add("${id}.migrationPhase must be a valid Phase 8-22 number")
            requireList("${id}.sourcePaths", entry.sourcePaths)
            asList(entry.sourcePaths).each { String sourcePath ->
                if (!file(sourcePath).isFile()) errors.add("frozen decision ${id} references missing source ${sourcePath}")
            }
        }
        Map<String, List<String>> requiredFrozenDecisions = [
                'mayor-door-repair-activity': ['WORK', 'villageId + MAYOR + mayor UUID + door position + task generation'],
                'mayor-governor-follow-activity': ['IDLE', 'villageId + MAYOR + mayor UUID + candidate UUID + session generation'],
                'avoidance-safety-activity': ['CORE', 'villager UUID + hazard identity + safety generation'],
                'begging-social-session': ['WORK', 'beggar UUID + donor UUID + session generation'],
                'lumberjack-shared-furnace-pool': ['WORK', 'villageId + LUMBERJACK + furnace identity + owner UUID + generation'],
                'farmer-pumpkin-work-cell-pipeline': ['WORK', 'villageId + FARMER + work-cell identity + attached pumpkin position + owner UUID + task generation'],
                'farmer-assignment-excludes-bank-employees': ['bank employees are ineligible', 'villageId + FARMER + eligible non-bank-employee villager UUID + work-cell lease generation'],
                'move-to-target-sink-compatibility': ['compatibility observer only', 'vanilla MoveToTargetSink observation; no task owner and no route restoration']
        ]
        requiredFrozenDecisions.each { String id, List<String> expected ->
            Map actual = frozenDecisions.find { Map entry -> text(entry.id) == id }
            if (actual == null) {
                errors.add("missing frozen Phase 2 decision ${id}")
            } else {
                if (text(actual.decision) != expected[0]) errors.add("${id}.decision must be ${expected[0]}")
                if (text(actual.ownershipScope) != expected[1]) errors.add("${id}.ownershipScope must be ${expected[1]}")
            }
        }
        if (!asList(manifest.unresolvedDecisions).isEmpty()) errors.add('unresolvedDecisions must be empty after Phase 2 decisions are frozen')

        Set<String> allIds = [] as Set<String>
        Set<String> inventorySources = [] as Set<String>
        def registerId = { String category, Map entry ->
            String id = text(entry.id)
            if (!id || !allIds.add(id)) errors.add("duplicate or empty ${category} id: ${id}")
            paths(entry).each { String sourcePath ->
                inventorySources.add(sourcePath)
                if (!file(sourcePath).isFile()) errors.add("${category} ${id} references missing source ${sourcePath}")
            }
        }
        def phase = { String label, Object value ->
            if (!(value instanceof Number) || !validPhases.contains(value as Integer)) errors.add("${label} must be a valid Phase 8-22 number")
        }

        List<Map> producers = asList(manifest.producers) as List<Map>
        Set<String> producerRoles = [] as Set<String>
        producers.each { Map producer ->
            registerId('producer', producer)
            String id = text(producer.id)
            String role = text(producer.role)
            producerRoles.add(role)
            requireText("${id}.role", role)
            requireList("${id}.sourcePaths", producer.sourcePaths)
            Map current = (producer.current ?: [:]) as Map
            Map target = (producer.target ?: [:]) as Map
            ['executor', 'scheduler', 'activity', 'memoryReads', 'memoryWrites', 'directNavigationOps', 'claimScope', 'durableState', 'transientState', 'cleanupOwner'].each { String key ->
                key in ['memoryReads', 'memoryWrites', 'directNavigationOps'] ? requireList("${id}.current.${key}", current[key]) : requireText("${id}.current.${key}", current[key])
            }
            ['activity', 'finality', 'priority', 'requiredMemoryConditions', 'interruptions', 'resumeReacquire', 'claimScope', 'durableState', 'transientState', 'cleanupOwner'].each { String key ->
                requireText("${id}.target.${key}", target[key])
            }
            phase("${id}.migrationPhase", producer.migrationPhase)
            if ((producer.migrationPhase as Integer) == 8) errors.add("${id} assigns behavior migration to Phase 8; Phase 8 is infrastructure only")
            requireText("${id}.legacyPathToRemove", producer.legacyPathToRemove)
            requireText("${id}.knownGap", producer.knownGap)
            errors.addAll(NavigationArchitectureScanner.validateFrozenText(id, target))
        }
        Set<String> requiredRoles = asList(manifest.requiredRoles).collect { it.toString() } as Set<String>
        (requiredRoles - producerRoles).each { errors.add("navigation inventory is missing required role ${it}") }
        Set<String> requiredCoverage = asList(manifest.requiredCoverage).collect { it.toString() } as Set<String>
        (requiredCoverage - producerRoles).each { errors.add("navigation inventory is missing required coverage role ${it}") }

        def validateEntries = { String category, List<Map> entries, List<String> requiredKeys, boolean requirePhase ->
            entries.each { Map entry ->
                registerId(category, entry)
                String id = text(entry.id)
                requireList("${id}.sourcePaths", entry.sourcePaths)
                requiredKeys.each { String key -> requireText("${id}.${key}", entry[key]) }
                if (requirePhase) phase("${id}.migrationPhase", entry.migrationPhase)
                if (entry.containsKey('legacyPathToRemove')) requireText("${id}.legacyPathToRemove", entry.legacyPathToRemove)
            }
        }
        validateEntries('registered Brain behavior', asList(manifest.registeredBrainBehaviors) as List<Map>, ['owner', 'currentExecutor', 'targetBrainActivity', 'finality', 'requiredMemoryConditions', 'claimScope', 'durableState', 'transientState', 'cleanupOwner', 'migrationPhase', 'legacyPathToRemove', 'knownGap'], true)
        validateEntries('request owner', asList(manifest.requestOwners) as List<Map>, ['owner', 'currentExecutor', 'targetBrainActivity', 'currentClaimScope', 'targetClaimScope', 'currentCleanupOwner', 'targetCleanupOwner', 'migrationPhase', 'legacyPathToRemove', 'knownGap'], true)
        asList(manifest.requestOwners).each { Map entry -> requireList("${entry.id}.memoryReads", entry.memoryReads); requireList("${entry.id}.memoryWrites", entry.memoryWrites); requireList("${entry.id}.directNavigationOps", entry.directNavigationOps) }
        validateEntries('memory mutation', asList(manifest.memoryMutations) as List<Map>, ['mutationKind', 'owner', 'classification', 'targetOwner', 'targetPhase', 'notes'], false)
        asList(manifest.memoryMutations).each { Map entry -> requireList("${entry.id}.memories", entry.memories); phase("${entry.id}.targetPhase", entry.targetPhase) }
        validateEntries('direct navigation entry', asList(manifest.directNavigationCalls) as List<Map>, ['currentOwner', 'currentExecutor', 'currentClaimScope', 'targetDisposition', 'migrationPhase', 'legacyPathToRemove', 'notes'], true)
        asList(manifest.directNavigationCalls).each { Map entry -> requireList("${entry.id}.operations", entry.operations) }
        validateEntries('GoalSelector registrar', asList(manifest.goalSelectorRegistrars) as List<Map>, ['executor', 'scope', 'targetDisposition', 'migrationPhase', 'legacyPathToRemove', 'notes'], true)
        validateEntries('transitional movement caller', asList(manifest.transitionalMovementCallers) as List<Map>, ['owner', 'currentUse', 'targetDisposition', 'migrationPhase', 'legacyPathToRemove', 'notes'], true)
        validateEntries('persistent gameplay state', asList(manifest.persistentGameplayState) as List<Map>, ['owner', 'currentState', 'targetOwner', 'targetState', 'cleanupOwner', 'migrationPhase', 'knownGap'], true)
        validateEntries('transient claim', asList(manifest.transientClaims) as List<Map>, ['owner', 'currentScope', 'targetScope', 'durability', 'cleanupOwner', 'migrationPhase', 'violation'], true)
        validateEntries('non-villager exception', asList(manifest.nonVillagerExceptions) as List<Map>, ['entityClass', 'reason', 'disposition'], false)
        asList(manifest.violations).each { Map entry -> registerId('violation', entry); ['status', 'statement', 'resolutionPhase'].each { String key -> requireText("${entry.id}.${key}", entry[key]) }; phase("${entry.id}.resolutionPhase", entry.resolutionPhase); requireList("${entry.id}.affectedPaths", entry.affectedPaths) }
        asList(manifest.unresolvedDecisions).each { Map entry -> registerId('unresolved decision', entry); ['question', 'provisionalDecision', 'decisionPhase'].each { String key -> requireText("${entry.id}.${key}", entry[key]) }; phase("${entry.id}.decisionPhase", entry.decisionPhase); requireList("${entry.id}.affectedPaths", entry.affectedPaths) }

        // Owner IDs are valid only when they come from a real inventory record.
        // sourceOwnership and reference rows are consumers of this set; they do
        // not define it, so an invented ID cannot validate itself.
        Map<String, String> ownerCategories = [:]
        def collectOwnerCategory = { String category, String key ->
            asList(manifest[key]).each { Map entry ->
                String id = text(entry.id)
                if (id) ownerCategories[id] = category
            }
        }
        [
                ['producer', 'producers'],
                ['brain-behavior', 'registeredBrainBehaviors'],
                ['request-owner', 'requestOwners'],
                ['memory', 'memoryMutations'],
                ['navigation', 'directNavigationCalls'],
                ['registrar', 'goalSelectorRegistrars'],
                ['transitional-caller', 'transitionalMovementCallers'],
                ['state', 'persistentGameplayState'],
                ['claim', 'transientClaims'],
                ['exception', 'nonVillagerExceptions']
        ].each { List<String> spec -> collectOwnerCategory(spec[0], spec[1]) }
        Set<String> canonicalOwnerIds = ownerCategories.keySet() as Set<String>

        Map allowlists = (manifest.allowlists ?: [:]) as Map
        ['pathMemoryWriters', 'directNavigationCallers', 'goalSelectorRegistrars', 'transitionalMovementCallers'].each { String key ->
            List<String> entries = asList(allowlists[key]).collect { it.toString().replace('\\', '/') }
            if (entries.isEmpty()) errors.add("allowlists.${key} must not be empty")
            entries.each { String sourcePath ->
                if (!file(sourcePath).isFile()) errors.add("allowlists.${key} references missing source ${sourcePath}")
            }
        }
        List<Map> ownership = asList(manifest.sourceOwnership) as List<Map>
        Set<String> ownedPaths = [] as Set<String>
        ownership.each { Map entry ->
            String sourcePath = text(entry.path).replace('\\', '/')
            if (!sourcePath || !ownedPaths.add(sourcePath)) errors.add("duplicate or empty source ownership entry: ${sourcePath}")
            if (!file(sourcePath).isFile()) errors.add("sourceOwnership references missing source ${sourcePath}")
            requireText("sourceOwnership ${sourcePath}.ownerId", entry.ownerId)
        }
        errors.addAll(NavigationArchitectureScanner.validateOwnerReferences(
                canonicalOwnerIds,
                ownerCategories,
                ownership,
                asList(manifest.transitionalReferenceInventory) as List<Map>,
                asList(manifest.directNavigationReferenceInventory) as List<Map>,
                asList(manifest.goalSelectorReferenceInventory) as List<Map>))
        List<Map> transitionalReferences = asList(manifest.transitionalReferenceInventory) as List<Map>
        Set<String> transitionalReferenceKeys = [] as Set<String>
        transitionalReferences.each { Map entry ->
            String id = text(entry.id)
            String sourcePath = text(entry.sourcePath).replace('\\', '/')
            String referenceName = text(entry.referenceName)
            String key = "${sourcePath}|${referenceName}"
            if (!id || !allIds.add(id)) errors.add("duplicate or empty transitional reference id: ${id}")
            if (!transitionalReferenceKeys.add(key)) errors.add("duplicate transitional reference inventory entry: ${key}")
            if (!file(sourcePath).isFile()) errors.add("transitional reference inventory references missing source ${sourcePath}")
            if (!(referenceName in ['MovementRequestManager', 'VillagerMovementRequestBinding'])) errors.add("${id}.referenceName must name a transitional movement type")
            ['ownerId', 'referenceCategory', 'legacyPathToRemove', 'notes'].each { String field -> requireText("${id}.${field}", entry[field]) }
            if (!canonicalOwnerIds.contains(text(entry.ownerId))) errors.add("${id}.ownerId is not an inventoried owner")
            if (!(entry.expectedOccurrences instanceof Number) || (entry.expectedOccurrences as Integer) < 1) errors.add("${id}.expectedOccurrences must be a positive number")
            if (!(entry.migrationPhase instanceof Number) || !validPhases.contains(entry.migrationPhase as Integer)) errors.add("${id}.migrationPhase must be a valid Phase 8-22 number")
        }
        Set<String> implementationPaths = transitionalReferences.findAll { Map entry -> text(entry.referenceCategory) == 'implementation' }
                .collect { Map entry -> text(entry.sourcePath).replace('\\', '/') } as Set<String>
        Set<String> callerPaths = (asList(manifest.transitionalMovementCallers) as List<Map>).collectMany { Map entry -> paths(entry) } as Set<String>
        if (!implementationPaths.intersect(callerPaths).isEmpty()) errors.add('MovementRequestManager and VillagerMovementRequestBinding implementation files must be inventoried separately from transitional callers')

        Set<String> productionSources = fileTree('src/main/java').matching { include '**/*.java' }.files
                .collect { relativePath(it).replace('\\', '/') }
                .findAll { String path -> !path.contains('/test/') && !path.endsWith('GameTests.java') } as Set<String>
        Set<String> exceptionSources = (asList(manifest.nonVillagerExceptions) as List<Map>).collectMany { paths(it) } as Set<String>
        Set<String> allowlistedSources = ['pathMemoryWriters', 'directNavigationCallers', 'goalSelectorRegistrars', 'transitionalMovementCallers']
                .collectMany { String key -> asList(allowlists[key]).collect { it.toString().replace('\\', '/') } } as Set<String>
        errors.addAll(NavigationArchitectureScanner.validateAllowlistedSources(
                allowlistedSources, inventorySources, exceptionSources))
        Map wantedItemProducer = (producers.find { Map producer -> text(producer.id) == 'wanted-item-pursuit' } ?: [:]) as Map
        Set<String> wantedItemSources = paths(wantedItemProducer) as Set<String>
        Set<String> skrimisherSources = ((asList(manifest.nonVillagerExceptions) as List<Map>).findAll { Map entry -> text(entry.id) == 'skrimisher-navigation' }
                .collectMany { Map entry -> paths(entry) } as Set<String>)
        if (wantedItemSources.intersect(exceptionSources)) errors.add('wanted-item-pursuit cannot use a non-villager exception source')
        if (!skrimisherSources.intersect(wantedItemSources).isEmpty()) errors.add('EmeraldSkrimisher pickup sources cannot satisfy the villager wanted-item producer')
        errors.addAll(NavigationArchitectureScanner.validateWantedItemProducer(wantedItemProducer, exceptionSources, [
                'src/main/java/com/orangevillager61/emeraldcapitalism/util/VillagerPickupCompat.java',
                'src/main/java/com/orangevillager61/emeraldcapitalism/util/VillagerInventoryPolicy.java',
                'src/main/java/com/orangevillager61/emeraldcapitalism/mixin/VillagerPickupPolicyMixin.java',
                'src/main/java/com/orangevillager61/emeraldcapitalism/mixin/VillagerPickupAccountingMixin.java'
        ]))
        Set<String> memoryMutationSources = (asList(manifest.memoryMutations) as List<Map>).collectMany { paths(it) } as Set<String>
        // Source-level scanning is delegated to NavigationArchitectureScanner.
        List<Map> directReferenceInventory = asList(manifest.directNavigationReferenceInventory) as List<Map>
        Set<String> directReferenceKeys = [] as Set<String>
        directReferenceInventory.each { Map entry ->
            String id = text(entry.id)
            String sourcePath = text(entry.sourcePath).replace('\\', '/')
            String key = sourcePath
            if (!id || !allIds.add(id)) errors.add("duplicate or empty direct navigation reference id: ${id}")
            if (!directReferenceKeys.add(key)) errors.add("duplicate direct navigation reference inventory entry: ${key}")
            if (!file(sourcePath).isFile()) errors.add("direct navigation reference inventory references missing source ${sourcePath}")
            ['ownerId', 'referenceCategory', 'legacyPathToRemove'].each { String field -> requireText("${id}.${field}", entry[field]) }
            if (!canonicalOwnerIds.contains(text(entry.ownerId))) errors.add("${id}.ownerId is not an inventoried owner")
            Map expectedOperations = (entry.expectedOperations ?: [:]) as Map
            NavigationArchitectureScanner.NAVIGATION_OPERATIONS.each { String operation ->
                if (!(expectedOperations[operation] instanceof Number) || (expectedOperations[operation] as Integer) < 0) errors.add("${id}.expectedOperations.${operation} must be a non-negative number")
            }
            if (!(entry.migrationPhase instanceof Number) || !validPhases.contains(entry.migrationPhase as Integer)) errors.add("${id}.migrationPhase must be a valid Phase 8-22 number")
        }
        List<Map> goalReferenceInventory = asList(manifest.goalSelectorReferenceInventory) as List<Map>
        Set<String> goalReferencePaths = [] as Set<String>
        goalReferenceInventory.each { Map entry ->
            String id = text(entry.id)
            String sourcePath = text(entry.sourcePath).replace('\\', '/')
            if (!id || !allIds.add(id)) errors.add("duplicate or empty GoalSelector reference id: ${id}")
            if (!goalReferencePaths.add(sourcePath)) errors.add("duplicate GoalSelector reference inventory entry: ${sourcePath}")
            if (!file(sourcePath).isFile()) errors.add("GoalSelector reference inventory references missing source ${sourcePath}")
            ['ownerId', 'referenceCategory', 'legacyPathToRemove'].each { String field -> requireText("${id}.${field}", entry[field]) }
            if (!canonicalOwnerIds.contains(text(entry.ownerId))) errors.add("${id}.ownerId is not an inventoried owner")
            if (!(entry.expectedOccurrences instanceof Number) || (entry.expectedOccurrences as Integer) < 1) errors.add("${id}.expectedOccurrences must be a positive number")
            if (!(entry.migrationPhase instanceof Number) || !validPhases.contains(entry.migrationPhase as Integer)) errors.add("${id}.migrationPhase must be a valid Phase 8-22 number")
        }
        Set<String> allowedPathWriters = asList(allowlists.pathMemoryWriters).collect { it.toString().replace('\\', '/') } as Set<String>
        Map scannerOptions = [
                transitionalReferences: transitionalReferences,
                directNavigationReferences: directReferenceInventory,
                goalSelectorReferences: goalReferenceInventory,
                memoryMutationSources: memoryMutationSources,
                pathMemoryWriters: allowedPathWriters
        ]
        productionSources.each { String sourcePath ->
            errors.addAll(NavigationArchitectureScanner.validateSource(
                    sourcePath, file(sourcePath).getText('UTF-8'), scannerOptions))
        }
        def gitOutput = { List<String> args ->
            Process process = (['git'] + args).execute(null, project.projectDir)
            String output = process.text
            if (process.waitFor() != 0) throw new GradleException("git ${args.join(' ')} failed: ${output}")
            output.trim()
        }
        String gitCommit = gitOutput(['rev-parse', 'HEAD'])
        String gitStatusOutput = gitOutput(['status', '--porcelain'])
        String dirtyStatus = gitStatusOutput ? 'dirty' : 'clean'

        File report = file('build/reports/phase2/navigation-ownership.md')
        report.parentFile.mkdirs()
        def markdownCell = { Object value ->
            Object rendered = value instanceof Collection ? value.collect { it.toString() }.join('; ') : value
            (rendered == null ? '' : rendered.toString()).replace('|', '\\|').replace('\r', ' ').replace('\n', ' ')
        }
        def appendTable = { StringBuilder builder, String title, List<String> headers, List<List<Object>> rows ->
            builder.append('\n## ').append(title).append('\n\n')
            builder.append('| ').append(headers.collect { markdownCell(it) }.join(' | ')).append(' |\n')
            builder.append('| ').append(headers.collect { '---' }.join(' | ')).append(' |\n')
            rows.each { List<Object> row -> builder.append('| ').append(row.collect { markdownCell(it) }.join(' | ')).append(' |\n') }
        }
        StringBuilder markdownBuilder = new StringBuilder()
                .append('# Phase 2 navigation ownership inventory\n\n')
                .append('Generated from `gradle/navigation-architecture.json`; this report has no timestamp so the source revision is reproducible.\n\n')
                .append('**Git commit:** `').append(gitCommit).append('`  \n')
                .append('**Working tree:** ').append(dirtyStatus).append('\n')
        if (gitStatusOutput) markdownBuilder.append('**Dirty paths:**\n\n```text\n').append(gitStatusOutput).append('\n```\n')
        markdownBuilder.append('\n**Enforced decision:** ').append(markdownCell(architecture.decision)).append('\n')
                .append('**Valid migration phases:** Phase 8 infrastructure through Phase 22 legacy removal. Phase 8 is explicitly not a behavior migration.\n')
        appendTable(markdownBuilder, 'Architecture: current versus target', ['Boundary', 'Current', 'Target'], [
                ['Scheduler', architecture.current.scheduler, architecture.target.scheduler],
                ['Task ownership', architecture.current.taskOwnership, architecture.target.taskOwnership],
                ['Movement intent', architecture.current.movementIntent, architecture.target.movementIntent],
                ['Route executor', architecture.current.routeExecutor, architecture.target.routeExecutor],
                ['Cleanup', architecture.current.cleanup, architecture.target.cleanup]
        ])
        appendTable(markdownBuilder, 'Migration phase plan', ['Phase', 'Name', 'Scope'],
                migrationPlan.sort { Map left, Map right -> (left.phase as Integer) <=> (right.phase as Integer) }
                        .collect { Map entry -> [entry.phase, entry.name, entry.scope] })
        appendTable(markdownBuilder, 'Task and integration producers', ['ID / role', 'Sources', 'Current executor / scheduler / activity', 'Target scheduler', 'Target activity / finality / priority', 'Memory reads / writes', 'Direct navigation', 'Current scope', 'Target scope', 'Durable / transient current', 'Durable / transient target', 'Cleanup current / target', 'Phase', 'Legacy path', 'Known gap'],
                producers.collect { Map producer ->
                    Map current = producer.current as Map; Map target = producer.target as Map
                    ["${producer.id} / ${producer.role}", paths(producer), "${current.executor} / ${current.scheduler} / ${current.activity}", architecture.scheduler, "${target.activity} / ${target.finality} / ${target.priority}", "R: ${current.memoryReads}; W: ${current.memoryWrites}", current.directNavigationOps, current.claimScope, target.claimScope, "D: ${current.durableState}; T: ${current.transientState}", "D: ${target.durableState}; T: ${target.transientState}", "Current: ${current.cleanupOwner}; Target: ${target.cleanupOwner}", producer.migrationPhase, producer.legacyPathToRemove, producer.knownGap]
                })
        appendTable(markdownBuilder, 'Registered Brain behaviors', ['ID', 'Owner / sources', 'Current executor', 'Target activity / finality', 'Memory conditions / reads / writes', 'Direct navigation', 'Scope', 'Durable / transient', 'Cleanup', 'Phase / legacy path / gap'],
                (asList(manifest.registeredBrainBehaviors) as List<Map>).collect { Map e -> [e.id, "${e.owner}; ${paths(e)}", e.currentExecutor, "${e.targetBrainActivity}; ${e.finality}", "${e.requiredMemoryConditions}; R: ${e.memoryReads}; W: ${e.memoryWrites}", e.directNavigationOps, e.claimScope, "D: ${e.durableState}; T: ${e.transientState}", e.cleanupOwner, "${e.migrationPhase}; ${e.legacyPathToRemove}; ${e.knownGap}"] })
        appendTable(markdownBuilder, 'Request owners', ['ID', 'Owner / sources', 'Current executor', 'Target activity', 'Memory reads / writes', 'Direct navigation', 'Current / target scope', 'Current / target cleanup', 'Phase / legacy path / gap'],
                (asList(manifest.requestOwners) as List<Map>).collect { Map e -> [e.id, "${e.owner}; ${paths(e)}", e.currentExecutor, e.targetBrainActivity, "R: ${e.memoryReads}; W: ${e.memoryWrites}", e.directNavigationOps, "${e.currentClaimScope} / ${e.targetClaimScope}", "${e.currentCleanupOwner} / ${e.targetCleanupOwner}", "${e.migrationPhase}; ${e.legacyPathToRemove}; ${e.knownGap}"] })
        appendTable(markdownBuilder, 'Brain memory mutations and observations', ['ID', 'Sources', 'Memories', 'Mutation kind', 'Current owner / classification', 'Target owner', 'Phase', 'Notes'],
                (asList(manifest.memoryMutations) as List<Map>).collect { Map e -> [e.id, paths(e), e.memories, e.mutationKind, "${e.owner} / ${e.classification}", e.targetOwner, e.targetPhase, e.notes] })
        appendTable(markdownBuilder, 'Direct navigation and path operations', ['ID', 'Sources', 'Operations', 'Current owner / executor', 'Current scope', 'Target disposition', 'Phase', 'Legacy path', 'Notes'],
                (asList(manifest.directNavigationCalls) as List<Map>).collect { Map e -> [e.id, paths(e), e.operations, "${e.currentOwner} / ${e.currentExecutor}", e.currentClaimScope, e.targetDisposition, e.migrationPhase, e.legacyPathToRemove, e.notes] })
        appendTable(markdownBuilder, 'GoalSelector registrars', ['ID', 'Sources', 'Executor', 'Scope', 'Target disposition', 'Phase', 'Legacy path', 'Notes'],
                (asList(manifest.goalSelectorRegistrars) as List<Map>).collect { Map e -> [e.id, paths(e), e.executor, e.scope, e.targetDisposition, e.migrationPhase, e.legacyPathToRemove, e.notes] })
        appendTable(markdownBuilder, 'Transitional movement callers', ['ID', 'Sources', 'Owner', 'Current use', 'Target disposition', 'Phase', 'Legacy path', 'Notes'],
                (asList(manifest.transitionalMovementCallers) as List<Map>).collect { Map e -> [e.id, paths(e), e.owner, e.currentUse, e.targetDisposition, e.migrationPhase, e.legacyPathToRemove, e.notes] })
        appendTable(markdownBuilder, 'Persistent gameplay state', ['ID', 'Sources', 'Owner / current state', 'Target owner / state', 'Cleanup owner', 'Phase', 'Known gap'],
                (asList(manifest.persistentGameplayState) as List<Map>).collect { Map e -> [e.id, paths(e), "${e.owner} / ${e.currentState}", "${e.targetOwner} / ${e.targetState}", e.cleanupOwner, e.migrationPhase, e.knownGap] })
        appendTable(markdownBuilder, 'Transient claims, leases, reservations, and caches', ['ID', 'Sources', 'Owner', 'Current scope', 'Target scope', 'Durability', 'Cleanup owner', 'Phase', 'Violation / decision'],
                (asList(manifest.transientClaims) as List<Map>).collect { Map e -> [e.id, paths(e), e.owner, e.currentScope, e.targetScope, e.durability, e.cleanupOwner, e.migrationPhase, e.violation] })
        appendTable(markdownBuilder, 'Explicit non-villager exceptions', ['ID', 'Entity class', 'Sources', 'Reason', 'Disposition'],
                (asList(manifest.nonVillagerExceptions) as List<Map>).collect { Map e -> [e.id, e.entityClass, paths(e), e.reason, e.disposition] })
        appendTable(markdownBuilder, 'Violations and unresolved decisions', ['ID', 'Status / question', 'Statement / provisional decision', 'Affected paths', 'Resolution phase'],
                (asList(manifest.violations) as List<Map>).collect { Map e -> [e.id, e.status, e.statement, e.affectedPaths, e.resolutionPhase] } +
                        (asList(manifest.unresolvedDecisions) as List<Map>).collect { Map e -> [e.id, "unresolved / ${e.question}", e.provisionalDecision, e.affectedPaths, e.decisionPhase] })
        appendTable(markdownBuilder, 'Frozen Phase 2 decisions', ['ID', 'Decision', 'Ownership scope', 'Phase', 'Reason', 'Sources'],
                (asList(manifest.frozenDecisions) as List<Map>).collect { Map e -> [e.id, e.decision, e.ownershipScope, e.migrationPhase, e.reason, paths(e)] })
        appendTable(markdownBuilder, 'Transitional manager and binding reference inventory', ['ID', 'Source', 'Reference', 'Owner', 'Category', 'Phase', 'Expected references', 'Legacy path', 'Notes'],
                (asList(manifest.transitionalReferenceInventory) as List<Map>).collect { Map e -> [e.id, e.sourcePath, e.referenceName, e.ownerId, e.referenceCategory, e.migrationPhase, e.expectedOccurrences, e.legacyPathToRemove, e.notes] })
        appendTable(markdownBuilder, 'Alias-independent direct navigation reference inventory', ['ID', 'Source', 'Owner', 'Category', 'Phase', 'Route mutation (moveTo)', 'Route creation (createPath)', 'Route cancellation (stop)', 'Route observation (getPath)', 'Legacy path'],
                (asList(manifest.directNavigationReferenceInventory) as List<Map>).collect { Map e -> [e.id, e.sourcePath, e.ownerId, e.referenceCategory, e.migrationPhase, e.expectedOperations?.moveTo, e.expectedOperations?.createPath, e.expectedOperations?.stop, e.expectedOperations?.getPath, e.legacyPathToRemove] })
        appendTable(markdownBuilder, 'Alias-independent GoalSelector reference inventory', ['ID', 'Source', 'Owner', 'Category', 'Phase', 'Expected registrations', 'Legacy path'],
                (asList(manifest.goalSelectorReferenceInventory) as List<Map>).collect { Map e -> [e.id, e.sourcePath, e.ownerId, e.referenceCategory, e.migrationPhase, e.expectedOccurrences, e.legacyPathToRemove] })
        markdownBuilder.append('\n## Validation evidence\n\n')
                .append('- Inventory categories: architecture current/target, producers, registered Brain behaviors, request owners, memory mutations, direct navigation, GoalSelector registrars, transitional callers, persistent gameplay state, transient claims, non-villager exceptions, violations, and unresolved decisions.\n')
                .append('- Production Java sources scanned: ').append(productionSources.size()).append('.\n')
                .append('- Frozen transitional references: ').append(transitionalReferences.size()).append('; direct navigation references: ').append(directReferenceInventory.size()).append('; GoalSelector registrations: ').append(goalReferenceInventory.size()).append('.\n')
                .append('- Source-backed allowlists: ').append(allowlistedSources.size()).append(' paths; explicit source ownership entries: ').append(ownership.size()).append('.\n')
                .append('- Validation result: ').append(errors.isEmpty() ? 'PASS' : 'FAIL').append('.\n')
        report.setText(markdownBuilder.toString(), 'UTF-8')

        if (!errors.isEmpty()) throw new GradleException('Navigation architecture validation failed:\n' + errors.unique().join('\n'))
        logger.lifecycle("Verified Phase 2 navigation architecture: ${producers.size()} producers, ${asList(manifest.transientClaims).size()} transient claim scopes, and ${productionSources.size()} production sources scanned.")
        logger.lifecycle("Generated ownership inventory: ${relativePath(report)} at commit ${gitCommit} (${dirtyStatus} tree)")
    }
}

tasks.register('verifyPortSetup') {
    group = 'verification'
    description = 'Verifies shared-source policy, target mapping/toolchain readiness, and regression manifests.'
    dependsOn 'verifySharedSourceLayout', 'verifyClientSmokeManifest', 'verifyRegressionCoverage', 'verifyNavigationArchitecture'
    dependsOn ':1.21.1:verifyTargetSetup', ':1.21.4:verifyTargetSetup'
}
