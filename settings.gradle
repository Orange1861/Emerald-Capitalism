pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.8+'
}

stonecutter.create(rootProject) {
    // One shared src/ tree is compiled for every target. versions/<target>/
    // contains metadata and only explicitly allowlisted API/resource overrides.
    // Java 21, Parchment mappings still required.
    // 1.21.11 remains metadata-only until its API port is complete. Keeping it
    // out of the Stonecutter project graph prevents the unported shared Mixins
    // from being compiled or loaded as if that target were supported.
    versions('1.21.1', '1.21.4')
        .buildscript('build-legacy.gradle')

    // 26.1 and 26.2 remain metadata-only until the calendar-version API port
    // begins; do not create build projects for these unported targets yet.
}

include(':core')
