# 26.1 ships Mojang's real parameter/variable names directly (obfuscation removed
# starting with 26.1 snapshots), so no Parchment mappings block is needed here.

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
# 26.1 covers 26.1 / 26.1.1 / 26.1.2 as one target; bump the patch here as needed,
# it doesn't require a new Stonecutter version node.
minecraft_version=26.1
java_version=25
# Covers the whole 26.1.x line (26.1 up to but not including 26.2).
minecraft_version_range=[26.1,26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
# Current as of NeoForge's maven metadata, Aug 29 2026. This is a stable
# (non-beta) build under the 26.1.2 patch line.
neo_version=26.1.2.100
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)
