// Shared build script for the pre-calendar-versioning NeoForge targets:
// 1.21.1, 1.21.4, 1.21.11 (Java 21, Parchment mappings still required).
// Each version folder supplies its own gradle.properties with values for
// neo_version, minecraft_version, minecraft_version_range, loader_version_range,
// mod_id, mod_name, mod_license, mod_version, mod_group_id,
// parchment_mappings_version, parchment_minecraft_version.

import com.orangevillager61.emeraldcapitalism.build.MixinAuditTask

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// Stonecutter shares this build script across three real Gradle subprojects
// (1.21.1, 1.21.4, 1.21.11), each with its own gradle.properties. Gradle's
// automatic loading of subproject-level gradle.properties files is
// inconsistent (documented as "limited support" in Gradle's own issue
// tracker), so load this project's file explicitly instead of relying on it.
def versionProps = new Properties()
file("$projectDir/gradle.properties").withInputStream { versionProps.load(it) }
versionProps.each { key, value -> project.ext.set(key, value) }

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users on this branch, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

evaluationDependsOn(':core')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            // NeoForge 1.21.1 resolves StructureUtils.testStructuresDir relative to the
            // game process working directory. Keep the checked-in GameTest fixture discoverable.
            gameDirectory = project.file('.')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(rootProject.project(':core').sourceSets.main)
        }
    }
}

tasks.register('auditMixins', MixinAuditTask) {
    group = 'verification'
    description = 'Validates and subtractively audits every configured mixin in isolated GameTest JVMs.'
    dependsOn tasks.named('classes')
    dependsOn tasks.named('prepareGameTestServer')
    notCompatibleWithConfigurationCache('The task intentionally launches a sequential matrix of isolated JVMs.')

    repositoryDirectory.set(layout.projectDirectory)
    buildOutputDirectory.set(layout.buildDirectory)
    manifestFile.set(layout.projectDirectory.file('gradle/mixin-audit.json'))
    mixinConfigFile.set(layout.projectDirectory.file('src/main/resources/emeraldcapitalism.mixins.json'))
    vmArgsFile.set(layout.buildDirectory.file('moddev/gameTestServerRunVmArgs.txt'))
    programArgsFile.set(layout.buildDirectory.file('moddev/gameTestServerRunProgramArgs.txt'))
    legacyClasspathFile.set(layout.buildDirectory.file('moddev/gameTestServerLegacyClasspath.txt'))
    mergedMinecraftJar.set(layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-merged.jar"))
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.map { it.executablePath.asFile.absolutePath })
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':core')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.named('jar', Jar).configure {
    dependsOn(':core:classes')
    from(project(':core').sourceSets.main.output)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
