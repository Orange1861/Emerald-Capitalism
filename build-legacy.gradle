// Shared build script for the pre-calendar-versioning NeoForge targets:
// 1.21.1, 1.21.4, 1.21.11 (Java 21, Parchment mappings still required).
// The repository's src/ tree is shared. A version folder supplies only its
// gradle.properties and any explicitly allowlisted target override.

import com.orangevillager61.emeraldcapitalism.build.MixinAuditTask

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// Stonecutter shares this build script across three real Gradle subprojects
// (1.21.1, 1.21.4, 1.21.11), each with its own gradle.properties. Gradle's
// automatic loading of subproject-level gradle.properties files is
// inconsistent (documented as "limited support" in Gradle's own issue
// tracker), so load this project's file explicitly instead of relying on it.
def versionProps = new Properties()
file("$projectDir/gradle.properties").withInputStream { versionProps.load(it) }
versionProps.each { key, value -> project.ext.set(key, value) }

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = uri('https://maven.parchmentmc.org')
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users on this branch, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

sourceSets {
    main {
        java.setSrcDirs([rootProject.file('src/main/java'), file('src/main/java')].unique())
        resources.setSrcDirs([rootProject.file('src/main/resources'), file('src/main/resources')].unique())
    }
    test {
        java.setSrcDirs([rootProject.file('src/test/java'), file('src/test/java')].unique())
    }
}

tasks.register('verifyTargetSetup') {
    group = 'verification'
    description = 'Resolves this legacy target mappings and verifies its Java toolchain.'
    inputs.file(file('gradle.properties'))

    doLast {
        int configuredJava = Integer.parseInt(java_version)
        if (configuredJava != 21) {
            throw new GradleException("Legacy target ${minecraft_version} must declare java_version=21, found ${configuredJava}")
        }

        String coordinate = "org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip"
        def mappingConfiguration = configurations.detachedConfiguration(dependencies.create(coordinate))
        mappingConfiguration.transitive = false
        Set<File> resolvedMappings = mappingConfiguration.resolve()
        String expectedFile = "parchment-${parchment_minecraft_version}-${parchment_mappings_version}.zip"
        if (!resolvedMappings.any { it.name == expectedFile }) {
            throw new GradleException("Parchment mapping did not resolve for ${minecraft_version}: ${coordinate}")
        }

        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(configuredJava)
        }.get()
        if (launcher.metadata.languageVersion.asInt() != configuredJava) {
            throw new GradleException("Java ${configuredJava} toolchain was not selected for ${minecraft_version}")
        }
        logger.lifecycle("Verified ${minecraft_version}: ${coordinate} and Java ${configuredJava} (${launcher.metadata.installationPath})")
    }
}

evaluationDependsOn(':core')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            // NeoForge 1.21.1 resolves StructureUtils.testStructuresDir relative to the
            // game process working directory. Keep the checked-in GameTest fixture discoverable.
            gameDirectory = project.file('.')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // Minecraft 1.21.1 uses the combined data run. Starting with 1.21.4,
            // NeoForge exposes the split clientData/serverData run types instead.
            if (minecraft_version == '1.21.1') {
                data()
            } else {
                clientData()
            }

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(rootProject.project(':core').sourceSets.main)
        }
    }
}

tasks.register('auditMixins', MixinAuditTask) {
    group = 'verification'
    description = 'Validates and subtractively audits every configured mixin in isolated GameTest JVMs.'
    dependsOn tasks.named('classes')
    dependsOn tasks.named('prepareGameTestServer')
    notCompatibleWithConfigurationCache('The task intentionally launches a sequential matrix of isolated JVMs.')

    repositoryDirectory.set(rootProject.layout.projectDirectory)
    buildOutputDirectory.set(layout.buildDirectory)
    manifestFile.set(rootProject.layout.projectDirectory.file('gradle/mixin-audit.json'))
    mixinConfigFile.set(rootProject.layout.projectDirectory.file('src/main/resources/emeraldcapitalism.mixins.json'))
    vmArgsFile.set(layout.buildDirectory.file('moddev/gameTestServerRunVmArgs.txt'))
    programArgsFile.set(layout.buildDirectory.file('moddev/gameTestServerRunProgramArgs.txt'))
    legacyClasspathFile.set(layout.buildDirectory.file('moddev/gameTestServerLegacyClasspath.txt'))
    mergedMinecraftJar.set(layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-merged.jar"))
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.map { it.executablePath.asFile.absolutePath })
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir file('src/generated/resources') }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':core')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.named('jar', Jar).configure {
    dependsOn(':core:classes')
    from(project(':core').sourceSets.main.output)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/templates')
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
